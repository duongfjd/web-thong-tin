name: Auto Build Android APK

on:
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để xuất APK thủ công bất kỳ lúc nào
  push:
    tags:
      - 'v*' # Tự build APK khi tạo tag phiên bản (ví dụ v1.0.0)

jobs:
  build:
    name: Build Android APK from PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Initialize & Build Android Project
        run: |
          # Tạo khóa ký tạm thời keystore
          keytool -genkeypair -v -keystore android.keystore -alias personalos -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=PersonalOS, OU=App, O=PersonalOS, L=Hanoi, S=Hanoi, C=VN"

          # Cấu hình bubblewrap không cần hỏi tương tác
          bubblewrap init --manifest="https://duongfjd.github.io/web-thong-tin/manifest.webmanifest" --directory="./android-project" || true

          # Build APK
          if [ -d "./android-project" ]; then
            cd android-project
            bubblewrap build --signingKeyPath="../android.keystore" --signingKeyAlias="personalos" --keyPassword="password" --keyStorePassword="password" || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalOS-Android-APK
          path: |
            **/*.apk
          if-no-files-found: warn
