<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal OS — Trợ lý cá nhân: timesheet, chi tiêu, bookmark, clipboard, snippets." />
  <title>Personal OS</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- ════════════════════════════════
       AUTH GATE (wrapper — always visible until inside app)
  ═══════════════════════════════════ -->
  <div id="auth-gate" class="auth-gate d-none">

    <!-- ── Screen 1: Supabase Login ── -->
    <div id="login-screen" class="d-none">
      <div class="auth-card">
        <div class="text-center mb-4">
          <div class="auth-logo">
            <i class="bi bi-layers-fill"></i>
          </div>
          <h1 class="fs-3 fw-bold mt-3">Personal OS</h1>
          <p class="text-muted small">Đăng nhập để tiếp tục</p>
        </div>
        <form id="login-form" autocomplete="on">
          <div id="login-error" class="alert alert-danger py-2 small mb-3 d-none" role="alert"></div>
          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input id="login-email" type="email" class="form-ctrl" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Mật khẩu</label>
            <input id="login-password" type="password" class="form-ctrl" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn-primary w-100 justify-content-center mt-2">
            <span id="login-loading" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
            Đăng nhập
          </button>
        </form>
      </div>
    </div>

    <!-- ── Screen 2: PIN Lock ── -->
    <div id="pin-screen" class="d-none">
      <div class="auth-card">
        <div class="text-center mb-4">
          <div class="auth-logo">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h1 class="fs-3 fw-bold mt-3">Xác nhận PIN</h1>
          <p class="text-muted small">Nhập mã PIN để mở khoá</p>
        </div>
        <form id="pin-form" autocomplete="off">
          <div class="pin-inputs mb-4">
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" id="pin0" />
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" id="pin1" />
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" id="pin2" />
            <input class="pin-digit" type="password" inputmode="numeric" maxlength="1" id="pin3" />
          </div>
          <div id="pin-error" class="text-danger text-center small mb-3 d-none">Mã PIN không đúng. Thử lại.</div>
          <button type="submit" class="btn-primary w-100 justify-content-center">Mở khóa</button>
          <div class="text-center mt-3">
            <button type="button" id="logout-btn" class="btn-ghost btn-sm text-muted">
              <i class="bi bi-box-arrow-left me-1"></i> Đăng xuất tài khoản khác
            </button>
          </div>
          <div class="text-center mt-2">
            <span class="text-muted small">PIN mặc định: <strong>1234</strong> — đổi trong Cài đặt</span>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- ════════════════════════════════
       APP SHELL
  ═══════════════════════════════════ -->
  <div id="app-shell" class="app-shell d-none">

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-brand">
          <i class="bi bi-layers-fill text-primary"></i>
          Personal OS
        </span>
        <button id="sidebar-close" class="btn-icon d-lg-none"><i class="bi bi-x-lg"></i></button>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-section-label">Menu</li>
        <li><a class="sidebar-link" href="#/dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
        <li><a class="sidebar-link" href="#/timesheet"><i class="bi bi-clock-history"></i> Timesheet</a></li>
        <li><a class="sidebar-link" href="#/expenses"><i class="bi bi-wallet2"></i> Chi tiêu</a></li>
        <li><a class="sidebar-link" href="#/bookmarks"><i class="bi bi-bookmark-star"></i> Bookmarks</a></li>
        <li><a class="sidebar-link" href="#/vault"><i class="bi bi-code-square"></i> Dev Vault</a></li>
        <li><a class="sidebar-link" href="#/clipboard"><i class="bi bi-clipboard2-pulse"></i> Clipboard</a></li>

        <li class="nav-section-label mt-3">Hệ thống</li>
        <li><a class="sidebar-link" href="#/settings"><i class="bi bi-gear"></i> Cài đặt</a></li>
      </ul>

      <div class="sidebar-footer">
        <div class="d-flex flex-column gap-1 w-100">
          <!-- User info -->
          <div id="sidebar-user" class="d-flex align-items-center gap-2 px-1 py-1">
            <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center flex-shrink-0"
                 style="width:28px;height:28px;font-size:12px;color:#fff">
              <i class="bi bi-person-fill"></i>
            </div>
            <span id="sidebar-email" class="text-muted small text-truncate" style="max-width:140px">—</span>
          </div>
          <div class="d-flex gap-1">
            <button id="theme-toggle" class="btn-icon flex-1" title="Chuyển theme">
              <i class="bi bi-moon-stars-fill"></i>
            </button>
            <button id="lock-btn" class="btn-icon flex-1" title="Khoá màn hình">
              <i class="bi bi-lock"></i>
            </button>
            <button id="signout-btn" class="btn-icon flex-1" title="Đăng xuất">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay d-lg-none"></div>

    <!-- Main -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="topbar">
        <button id="sidebar-toggle" class="btn-icon me-2 d-lg-none">
          <i class="bi bi-list fs-5"></i>
        </button>
        <div id="page-title" class="topbar-title">Dashboard</div>
        <div class="topbar-actions ms-auto">
          <button id="cmd-btn" class="btn btn-sm btn-outline-secondary d-none d-md-flex align-items-center gap-2" title="Ctrl+K">
            <i class="bi bi-search"></i>
            <span class="text-muted">Tìm kiếm...</span>
            <kbd class="kbd">Ctrl K</kbd>
          </button>
          <button id="cmd-btn-mobile" class="btn-icon d-md-none">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <main id="page-content" class="page-content">
        <div class="loading-screen">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- ════════════════════════════════
       COMMAND PALETTE
  ═══════════════════════════════════ -->
  <div id="cmd-palette" class="cmd-palette d-none">
    <div class="cmd-backdrop"></div>
    <div class="cmd-modal">
      <div class="cmd-search-wrap">
        <i class="bi bi-search cmd-search-icon"></i>
        <input id="cmd-input" type="text" placeholder="Tìm kiếm, nhập lệnh..." autocomplete="off" spellcheck="false" />
        <kbd class="kbd ms-auto me-2">Esc</kbd>
      </div>
      <ul id="cmd-results" class="cmd-results"></ul>
    </div>
  </div>

  <!-- ════════════════════════════════
       TOAST CONTAINER
  ═══════════════════════════════════ -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <!-- ════════════════════════════════
       SCRIPTS
       Order: Supabase CDN → client wrapper → utils → auth → modules → router → main → bootstrap
  ═══════════════════════════════════ -->

  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Core -->
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <!-- Modules -->
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/timesheet.js"></script>
  <script src="js/modules/expenses.js"></script>
  <script src="js/modules/bookmarks.js"></script>
  <script src="js/modules/vault.js"></script>
  <script src="js/modules/clipboard.js"></script>
  <script src="js/modules/settings.js"></script>

  <!-- Router + Bootstrap -->
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
