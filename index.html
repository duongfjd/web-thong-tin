<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Personal OS — Dashboard, Timesheet, Chi tiêu, Bookmarks, Second Brain, Web Opener." />
  <meta name="theme-color" content="#0d1117" />
  <title>Personal OS</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- ════════════════════════════════
       AUTH GATE
  ═══════════════════════════════════ -->
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="auth-logo">
          <i class="bi bi-layers-fill"></i>
        </div>
        <h1 class="fs-4 fw-bold mt-3">Personal OS</h1>
        <p class="text-muted small mt-1">Đăng nhập để tiếp tục</p>
      </div>
      <div class="d-flex mb-3 p-1 rounded" style="background:var(--clr-surface-2)">
        <button type="button" class="btn btn-sm flex-1 fw-semibold" id="auth-tab-login" style="background:var(--clr-surface-3);color:var(--clr-text)">Đăng nhập</button>
        <button type="button" class="btn btn-sm flex-1 text-muted" id="auth-tab-signup">Đăng ký</button>
      </div>

      <form id="login-form" autocomplete="on">
        <div id="login-error" class="alert alert-danger py-2 small mb-3 d-none" role="alert"></div>
        <div id="login-success" class="alert alert-success py-2 small mb-3 d-none" role="alert"></div>
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input id="login-email" type="email" class="form-ctrl" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu</label>
          <input id="login-password" type="password" class="form-ctrl" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" id="auth-submit-btn" class="btn-primary w-100 justify-content-center mt-2" style="display:flex">
          <span id="login-loading" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
          <span id="auth-submit-text">Đăng nhập</span>
        </button>
      </form>

      <div class="text-center mt-3 pt-3 border-top" style="border-color:var(--clr-border) !important">
        <button type="button" id="guest-btn" class="btn btn-sm btn-link text-muted text-decoration-none">
          <i class="bi bi-person-check me-1"></i>Dùng ngay không cần tài khoản (Lưu trên máy)
        </button>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════
       APP SHELL
  ═══════════════════════════════════ -->
  <div id="app-shell" class="app-shell d-none">

    <!-- Sidebar (desktop) -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-brand">
          <i class="bi bi-layers-fill text-primary"></i>
          Personal OS
        </span>
        <button id="sidebar-close" class="btn-icon d-md-none"><i class="bi bi-x-lg"></i></button>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-section-label">Menu</li>
        <li><a class="sidebar-link" href="#/dashboard" id="nav-dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
        <li><a class="sidebar-link" href="#/timesheet" id="nav-timesheet"><i class="bi bi-table"></i> Timesheet</a></li>
        <li><a class="sidebar-link" href="#/expenses"  id="nav-expenses"><i class="bi bi-wallet2"></i> Chi tiêu</a></li>
        <li><a class="sidebar-link" href="#/bookmarks" id="nav-bookmarks"><i class="bi bi-bookmark-star"></i> Bookmarks</a></li>
        <li><a class="sidebar-link" href="#/vault"     id="nav-vault"><i class="bi bi-code-square"></i> Dev Vault</a></li>
        <li><a class="sidebar-link" href="#/clipboard" id="nav-clipboard"><i class="bi bi-clipboard2-pulse"></i> Clipboard</a></li>
        <li><a class="sidebar-link" href="#/scrapbook" id="nav-scrapbook"><i class="bi bi-journal-bookmark"></i> Second Brain</a></li>
        <li><a class="sidebar-link" href="#/webopener" id="nav-webopener"><i class="bi bi-window"></i> Web Opener</a></li>
        <li><a class="sidebar-link" href="#/tools"     id="nav-tools"><i class="bi bi-tools"></i> Tiện ích Tools</a></li>

        <li class="nav-section-label mt-3">Hệ thống</li>
        <li><a class="sidebar-link" href="#/settings"  id="nav-settings"><i class="bi bi-gear"></i> Cài đặt</a></li>
      </ul>

      <div class="sidebar-footer">
        <div class="d-flex align-items-center gap-2 mb-2">
          <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center flex-shrink-0"
               style="width:28px;height:28px;font-size:12px;color:#fff">
            <i class="bi bi-person-fill"></i>
          </div>
          <span id="sidebar-email" class="text-muted small truncate" style="max-width:140px">—</span>
        </div>
        <div class="d-flex gap-1">
          <button id="theme-toggle" class="btn-icon flex-1" title="Chuyển theme">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <button id="signout-btn" class="btn-icon flex-1" title="Đăng xuất">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
    </nav>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main -->
    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="topbar">
        <button id="sidebar-toggle" class="btn-icon me-1 d-md-none">
          <i class="bi bi-list fs-5"></i>
        </button>
        <div id="page-title" class="topbar-title">Dashboard</div>
        <div class="topbar-actions ms-auto">
          <!-- Ctrl+K search button -->
          <button id="cmd-btn" class="btn btn-sm btn-outline-secondary d-none d-md-flex align-items-center gap-2" title="Ctrl+K" style="border-color:var(--clr-border);color:var(--clr-muted);background:var(--clr-surface-2);font-size:12px;padding:5px 10px">
            <i class="bi bi-search"></i>
            <span>Tìm kiếm...</span>
            <kbd class="kbd">Ctrl K</kbd>
          </button>
          <button id="cmd-btn-mobile" class="btn-icon d-md-none">
            <i class="bi bi-search"></i>
          </button>
          <!-- Web opener quick button -->
          <button id="topbar-web-btn" class="btn-icon" title="Web Opener" onclick="Router.navigate('/webopener')">
            <i class="bi bi-window"></i>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <main id="page-content" class="page-content">
        <div class="loading-screen">
          <div class="spinner-border text-primary" role="status"></div>
        </div>
      </main>
    </div>

    <!-- ── Bottom Nav (mobile) ── -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <a class="bottom-nav-item" href="#/dashboard"><i class="bi bi-grid-1x2"></i><span>Home</span></a>
        <a class="bottom-nav-item" href="#/timesheet"><i class="bi bi-table"></i><span>Sheet</span></a>
        <a class="bottom-nav-item" href="#/expenses"><i class="bi bi-wallet2"></i><span>Chi tiêu</span></a>
        <a class="bottom-nav-item" href="#/scrapbook"><i class="bi bi-journal-bookmark"></i><span>Brain</span></a>
        <a class="bottom-nav-item" href="#/webopener"><i class="bi bi-window"></i><span>Web</span></a>
      </div>
    </nav>
  </div>

  <!-- ════════════════════════════════
       COMMAND PALETTE
  ═══════════════════════════════════ -->
  <div id="cmd-palette" class="cmd-palette d-none">
    <div class="cmd-backdrop"></div>
    <div class="cmd-modal">
      <div class="cmd-search-wrap">
        <i class="bi bi-search cmd-search-icon"></i>
        <input id="cmd-input" type="text" placeholder="Tìm kiếm, nhập lệnh..." autocomplete="off" spellcheck="false" />
        <kbd class="kbd ms-auto me-2">Esc</kbd>
      </div>
      <ul id="cmd-results" class="cmd-results"></ul>
    </div>
  </div>

  <!-- ════════════════════════════════
       TOAST CONTAINER
  ═══════════════════════════════════ -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <!-- ════════════════════════════════
       SCRIPTS
  ═══════════════════════════════════ -->

  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Core -->
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/lunar.js"></script>
  <script src="js/auth.js"></script>

  <!-- Modules -->
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/timesheet.js"></script>
  <script src="js/modules/expenses.js"></script>
  <script src="js/modules/bookmarks.js"></script>
  <script src="js/modules/vault.js"></script>
  <script src="js/modules/clipboard.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/scrapbook.js"></script>
  <script src="js/modules/webopener.js"></script>
  <script src="js/modules/tools.js"></script>

  <!-- Router + Main + Bootstrap -->
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
